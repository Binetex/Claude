# ─────────────────────────────────────────────────────────────────────────────
# Floremart: страница обслуживания на время деплоя.
#
# Страница ВСТРОЕНА в конфиг, а не лежит файлом, СОЗНАТЕЛЬНО: nginx работает от
# пользователя clp, а каталог сайта — 770 floremart:floremart, внутрь nginx не видит.
# Файл он бы просто не прочитал. Встроенная страница не зависит ни от прав, ни от
# приложения — она отдаётся даже когда Node не запущен вовсе.
#
# Куда вставлять: CloudPanel → Sites → floremart.com → Vhost, ВНУТРЬ блока server { … },
# рядом с существующим location / { proxy_pass … }. Порядок блоков значения не имеет.
# После вставки — Save; CloudPanel сам сделает nginx -t и reload.
# ─────────────────────────────────────────────────────────────────────────────

# 1) Любая недоступность приложения → спокойная заглушка вместо 502 Bad Gateway.
#    Код всегда приводится к 503: это «временно недоступно», а не «сервер сломан».
error_page 502 503 504 =503 @maintenance;

# 2) ОПЦИОНАЛЬНО: явный флаг, который deploy.sh ставит только на секунды подмены и
#    рестарта. Строку можно не включать — пункт 1 закрывает то же окно сам.
#    ВАЖНО: если у сервиса nginx включён PrivateTmp, свой /tmp он не увидит; тогда либо
#    уберите эту строку, либо задайте общий путь и запускайте деплой с
#    FLOREMART_MAINT_FLAG=/путь/к/флагу ./deploy.sh
#
#    Вставлять ВНУТРЬ существующего location / { … }, первой строкой:
#
#        if (-f /tmp/floremart-maintenance) { return 503; }

location @maintenance {
    default_type text/html;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 503 '
        <!doctype html>
        <html lang="ru">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="refresh" content="10">
        <meta name="robots" content="noindex">
        <title>Floremart обновляется</title>
        <style>
          *{box-sizing:border-box}
          html,body{height:100%}
          body{margin:0;background:#f8fafc;color:#0f172a;
               font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
               display:flex;align-items:center;justify-content:center;padding:24px}
          .card{width:100%;max-width:420px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;
                box-shadow:0 1px 2px rgba(15,23,42,.06);padding:32px 28px;text-align:center}
          .logo{width:132px;height:auto;margin:0 auto 22px;display:block}
          h1{margin:0 0 12px;font-size:19px;font-weight:600;letter-spacing:-.01em}
          p{margin:0 0 8px;font-size:15px;color:#475569}
          .muted{margin-top:18px;font-size:13px;color:#94a3b8}
          .dots{display:inline-flex;gap:5px;margin-top:20px}
          .dots i{width:7px;height:7px;border-radius:50%;background:#cbd5e1;animation:p 1.4s infinite}
          .dots i:nth-child(2){animation-delay:.2s}
          .dots i:nth-child(3){animation-delay:.4s}
          @keyframes p{0%,60%,100%{opacity:.35}30%{opacity:1}}
          @media (prefers-reduced-motion:reduce){.dots i{animation:none}}
          @media (max-width:360px){.card{padding:26px 20px}h1{font-size:17px}}
        </style>
        </head>
        <body>
          <main class="card">
            <img class="logo" src="data:image/png;base64," alt="Floremart">
            <h1>Богдан обновляет Floremart</h1>
            <p>Сейчас вносятся улучшения в работу сайта.</p>
            <p>Подождите 1–3 минуты — страница обновится автоматически.</p>
            <span class="dots"><i></i><i></i><i></i></span>
            <div class="muted">Ничего делать не нужно, данные в безопасности.</div>
          </main>
        </body>
        </html>
';
}
